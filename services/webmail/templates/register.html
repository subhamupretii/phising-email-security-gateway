{% extends "base.html" %}
{% block title %}Create mailbox — Lab Mail{% endblock %}
{% block auth %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="flex flex-col items-center mb-6">
            <h1 class="text-2xl font-normal text-slate-800">Create a mailbox</h1>
            <p class="text-sm text-slate-500 mt-1">This account only exists on the local lab</p>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
            {% if error %}
            <div class="mb-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm px-4 py-3">{{ error }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input id="email" name="email" type="email" required autocomplete="username" placeholder="you@lab.local"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#1a73e8] focus:border-transparent">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#1a73e8] focus:border-transparent">
                </div>
                <div>
                    <label for="confirm" class="block text-sm font-medium text-slate-700 mb-1">Confirm password</label>
                    <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#1a73e8] focus:border-transparent">
                </div>
                <button type="submit" class="w-full rounded-lg bg-[#1a73e8] hover:bg-[#1765cc] text-white font-medium py-2.5 text-sm">Create mailbox</button>
            </form>
            <p class="mt-6 text-sm text-slate-600 text-center">
                Already have an account?
                <a href="{{ url_for('login') }}" class="text-[#1a73e8] font-medium hover:underline">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
